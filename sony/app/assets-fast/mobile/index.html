<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoxKey 云端识别配置</title><link rel="stylesheet" href="/style.css"><script defer src="/forge.js"></script><script defer src="/app.js"></script></head><body><main><span class="eyebrow">VoxKey</span><h1>连接百炼云端</h1><p>在手机填写，安全保存到投影仪。</p><form id="form"><label>云端模型<input value="Paraformer-realtime-v2 · 北京" disabled></label><label>百炼 API Key<input id="key" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="512" placeholder="输入北京地域 API Key"></label><small>已有密钥时，留空保留原密钥。</small><label>Workspace ID（选填）<input id="workspace" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="128" placeholder="留空使用公共接口"></label><label class="check"><input id="cloud" type="checkbox" checked>保存后切换到云端识别</label><button id="save" type="submit">保存到投影仪</button></form><p id="status" role="status">请保持投影仪配置页打开。二维码十分钟内有效。</p><footer>仅在可信的同一 Wi-Fi 使用。密钥提交前加密，不保存在手机浏览器中。保存配置不会开始录音或调用识别。</footer></main></body></html>
